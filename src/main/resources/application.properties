# ===================================================================
# BT3 Configuration: Refactored Defensive ETL Service
# ===================================================================

spring.application.name=AI Logistics Defensive ETL Service

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:incidentetldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging Level
logging.level.root=INFO
logging.level.com.logistics.incident=INFO
